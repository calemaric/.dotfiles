$background = rgb(1e1e2e)
$surface    = rgb(313244)
$text       = rgb(cdd6f4)
$accent     = rgb(cba6f7)
$blue       = rgb(89b4fa)
$font       = Hack Nerd Font Mono

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    brightness = 0.6
}

input-field {
    monitor =
    size = 280, 48
    position = 0, -100
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = $font

    placeholder_text = <i>Password...</i>
    dots_center = true
    fade_on_empty = true
    check_color = $blue
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 80
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $accent
    font_size = 20
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}
