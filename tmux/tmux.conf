set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins/'

# Keybindings
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

bind-key w run-shell -b "~/.config/tmux/scripts/workspace-navigation.sh nvim"
bind-key d run-shell -b "~/.config/tmux/scripts/workspace-navigation.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'


set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set -q @catppuccin_window_text ' #W'
set -g @catppuccin_window_default_text ' #W'
set -g @catppuccin_window_current_text ' #W'

run ~/.config/tmux/plugins/tmux/catppuccin.tmux

source -F '#{d:current_file}/custom_modules/memory.conf'
source -F '#{d:current_file}/custom_modules/time.conf'

set -g status-right-length 100
set -g status-left-length 100

set -g status-left '#{E:@catppuccin_status_session} '
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_memory}"
set -agF status-right "#{E:@catppuccin_status_time}"


if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
